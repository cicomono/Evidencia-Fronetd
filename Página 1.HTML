<form>

<fieldset> <!-- para recuadro-->

    <legend>ejemplos de inputs</legend>

    <LABEL>NÚMERO DE CONTACTO:</LABEL>
    <input type="tel" style="border-color: blue; border-radius: 20%;"> <BR>

    <LABEL>CAPTURAR DIRECCIÓN PÁGINA WEB:</LABEL>
    <input type="url" style="border-color: red;"> <BR></BR>

    <LABEL>CAPTURAR E-MAIL:</LABEL>
    <input type="email"> <BR></BR>

    <label>SELECCIONAR:</label>
    <input type="radio"> <BR></BR>

    <LABEL>CAPTURAR MES:</LABEL>
    <LABEL>CAPTURAR SEMANA:</LABEL>
<input type="week" required> <BR></BR>

<input type="date" required> <BR></BR>

<LABEL>CAPTURAR FECHA Y HORA LOCAL:</LABEL>
<input type="datetime-local"> <BR></BR>

    <input type="reset">
</p>

</p>
